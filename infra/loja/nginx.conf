# nginx do servidor da loja: serve o painel e faz proxy da API na mesma origem.
# Assim tablets, caixa e cozinha abrem http://comandada.local (ou o IP do servidor)
# e o painel fala com /api e /ws sem saber o endereço da máquina.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de imagem e documentos (o limite do storage é 25 MB)
    client_max_body_size 30m;

    # API: /api/orders -> http://api:3333/orders
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Tempo real (cozinha, caixa, entrega, conversas)
    location = /ws {
        proxy_pass http://api:3333/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Painel da cozinha fica aberto o dia todo
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # O service worker precisa ser sempre revalidado, senão o tablet fica preso numa versão velha
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "0";
}
